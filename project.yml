name: SolarDesigner
options:
  bundleIdPrefix: com.solardesigner
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
targets:
  SolarDesigner:
    type: application
    platform: iOS
    sources:
      - SolarDesigner
    info:
      path: SolarDesigner/Info.plist
      properties:
        CFBundleDisplayName: Solar Designer
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "Used to centre the map on your current location so you can find the roof."
        NSCameraUsageDescription: "Used to mark the skyline and obstacles around the roof on site."
        NSMotionUsageDescription: "Used with the compass to measure the direction and height of obstacles."
        NSPhotoLibraryUsageDescription: "Used to import roof screenshots and 360° videos."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solardesigner.app
        TARGETED_DEVICE_FAMILY: "1,2"
  SolarDesignerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SolarDesignerTests
    dependencies:
      - target: SolarDesigner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.solardesigner.tests
schemes:
  SolarDesigner:
    build:
      targets:
        SolarDesigner: all
        SolarDesignerTests: [test]
    test:
      targets:
        - SolarDesignerTests
